name: EventPlanner
options:
  bundleIdPrefix: com.badii
  deploymentTarget:
    iOS: "17.0"
targets:
  EventPlanner:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - EventPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badii.eventplanner
        PRODUCT_NAME: EventPlanner
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Event Planner Pro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
