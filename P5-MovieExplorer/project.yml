name: MovieExplorer
options:
  bundleIdPrefix: com.badii
  deploymentTarget:
    iOS: "17.0"
targets:
  MovieExplorer:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - MovieExplorer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.badii.movieexplorer
        PRODUCT_NAME: MovieExplorer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Movie Explorer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
